<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif;background:#0f172a}.container{background:#fff;border-radius:12px;box-shadow:0 10px 40px #0003;width:100%;max-width:500px;padding:30px}h1{text-align:center;color:#333;margin:0 0 25px}.summary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:8px;margin-bottom:25px;text-align:center}.total{font-size:32px;font-weight:700}.label{font-size:12px;opacity:.9}.form-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.form-group.full{grid-column:1/-1}input,select{padding:12px;border:2px solid #e0e0e0;border-radius:6px;font-size:14px}button{width:100%;padding:12px;background:#667eea;color:#fff;border:0;border-radius:6px;font-weight:600;cursor:pointer}.expenses-list{margin-top:25px}.expense-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f5f5f5;border-radius:6px;margin-bottom:10px}.expense-left{flex:1}.expense-name{font-weight:600;color:#333}.expense-category{font-size:12px;color:#999}.expense-amount{font-size:18px;font-weight:700;color:#ff6b6b;margin-right:10px}.delete-btn{width:auto;padding:6px 12px;background:#ff6b6b;font-size:12px}.empty-state{text-align:center;color:#999;padding:30px}</style></head><body><div class="container"><h1>💰 Expense Tracker</h1><div class="summary"><div class="total" id="totalAmount">$0.00</div><div class="label">Total Spent</div></div><div class="form-group full"><input type="text" id="expenseName" placeholder="Expense name (e.g., Coffee)"></div><div class="form-group"><input type="number" id="expenseAmount" placeholder="Amount" step="0.01"><select id="expenseCategory"><option>Food</option><option>Transport</option><option>Entertainment</option><option>Shopping</option><option>Utilities</option><option>Other</option></select></div><button onclick="addExpense()">Add Expense</button><div class="expenses-list"><div id="expensesList"></div></div></div><script>function loadExpenses(){const saved=localStorage.getItem('expenses');return saved?JSON.parse(saved):[]}function saveExpenses(expenses){localStorage.setItem('expenses',JSON.stringify(expenses))}function updateTotal(){const expenses=loadExpenses(),total=expenses.reduce((sum,exp)=>sum+parseFloat(exp.amount),0);document.getElementById('totalAmount').textContent='$'+total.toFixed(2)}function renderExpenses(){const expenses=loadExpenses(),list=document.getElementById('expensesList');if(!expenses.length){list.innerHTML='<div class="empty-state">No expenses yet. Add one to get started!</div>';updateTotal();return}list.innerHTML=expenses.map((exp,index)=>`<div class="expense-item"><div class="expense-left"><div class="expense-name">${escapeHtml(exp.name)}</div><div class="expense-category">${exp.category}</div></div><span class="expense-amount">$${parseFloat(exp.amount).toFixed(2)}</span><button class="delete-btn" onclick="deleteExpense(${index})">Delete</button></div>`).join('');updateTotal()}function addExpense(){const name=document.getElementById('expenseName').value.trim(),amount=document.getElementById('expenseAmount').value.trim(),category=document.getElementById('expenseCategory').value;if(!name||!amount){alert('Please fill all fields');return}const expenses=loadExpenses();expenses.push({name,amount:parseFloat(amount),category});saveExpenses(expenses);document.getElementById('expenseName').value='';document.getElementById('expenseAmount').value='';renderExpenses()}function deleteExpense(index){const expenses=loadExpenses();expenses.splice(index,1);saveExpenses(expenses);renderExpenses()}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}document.getElementById('expenseName').addEventListener('keypress',e=>{if(e.key==='Enter')addExpense()});renderExpenses()}</script></body></html>
