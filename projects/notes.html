<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes App</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#a8edea,#fed6e3)}.container{background:#fff;border-radius:12px;box-shadow:0 10px 40px #0003;width:100%;max-width:600px;padding:30px}h1{text-align:center;color:#333;margin:0 0 25px}.input-section{margin-bottom:25px}textarea{width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical;min-height:100px}.button-group{display:flex;gap:10px;margin-top:12px}button{flex:1;padding:12px;border:0;border-radius:6px;font-weight:600;cursor:pointer}.save-btn{background:#667eea;color:#fff}.clear-btn{background:#f5f5f5;color:#333;border:2px solid #e0e0e0}.notes-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin-top:25px}.note-card{background:linear-gradient(135deg,#ffecd2,#fcb69f);padding:15px;border-radius:8px;box-shadow:0 4px 12px #0002;min-height:150px;display:flex;flex-direction:column}.note-content{flex:1;font-size:13px;color:#333;word-wrap:break-word;line-height:1.5;white-space:pre-wrap}.note-date{font-size:11px;color:#0008;margin-bottom:8px}.note-delete{padding:6px 12px;background:#ff6b6b;color:#fff;width:100%;font-size:12px}.empty-state{text-align:center;color:#999;padding:40px 20px;grid-column:1/-1}</style></head><body><div class="container"><h1>📔 Notes App</h1><div class="input-section"><textarea id="noteInput" placeholder="Write your note here..."></textarea><div class="button-group"><button class="save-btn" onclick="addNote()">Save Note</button><button class="clear-btn" onclick="clearInput()">Clear</button></div></div><div class="notes-list" id="notesList"><div class="empty-state">No notes yet. Create one to get started!</div></div></div><script>function loadNotes(){const saved=localStorage.getItem('notes');return saved?JSON.parse(saved):[]}function saveNotes(notes){localStorage.setItem('notes',JSON.stringify(notes))}function formatDate(date){const d=new Date(date);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function renderNotes(){const notes=loadNotes(),list=document.getElementById('notesList');if(!notes.length){list.innerHTML='<div class="empty-state">No notes yet. Create one to get started!</div>';return}list.innerHTML=notes.map((note,index)=>`<div class="note-card"><div class="note-date">${formatDate(note.date)}</div><div class="note-content">${escapeHtml(note.text)}</div><button class="note-delete" onclick="deleteNote(${index})">Delete</button></div>`).join('')}function addNote(){const input=document.getElementById('noteInput'),text=input.value.trim();if(!text){alert('Please write something');return}const notes=loadNotes();notes.unshift({text,date:new Date().toISOString()});saveNotes(notes);input.value='';renderNotes()}function deleteNote(index){if(confirm('Delete this note?')){const notes=loadNotes();notes.splice(index,1);saveNotes(notes);renderNotes()}}function clearInput(){document.getElementById('noteInput').value=''}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}document.getElementById('noteInput').addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')addNote()});renderNotes()</script></body></html>
