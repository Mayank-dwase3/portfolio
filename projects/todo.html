<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Todo App</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui,sans-serif;background:#0f172a}.container{background:#fff;border-radius:12px;box-shadow:0 10px 40px #0003;width:100%;max-width:500px;padding:30px}h1{text-align:center;color:#333;margin:0 0 25px}.input-group{display:flex;gap:10px;margin-bottom:25px}input{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:6px;font-size:14px}input:focus{outline:0;border-color:#667eea}button{padding:12px 24px;background:#667eea;color:#fff;border:0;border-radius:6px;font-weight:600;cursor:pointer}.todo-list{display:flex;flex-direction:column;gap:10px}.todo-item{display:flex;align-items:center;gap:12px;padding:15px;background:#f5f5f5;border-radius:6px}.todo-item.completed{opacity:.6}.todo-item.completed span{text-decoration:line-through}.todo-text{flex:1;color:#333}.delete-btn{padding:6px 12px;background:#ff6b6b;font-size:12px}.empty-state{text-align:center;color:#999;padding:40px 20px}input[type=checkbox]{width:20px;height:20px;accent-color:#667eea}</style></head><body><div class="container"><h1>📝 My Todo App</h1><div class="input-group"><input type="text" id="todoInput" placeholder="Add a new task..."><button onclick="addTodo()">Add</button></div><div class="todo-list" id="todoList"><div class="empty-state">No tasks yet. Add one to get started!</div></div></div><script>function loadTodos(){const saved=localStorage.getItem('todos');return saved?JSON.parse(saved):[]}function saveTodos(todos){localStorage.setItem('todos',JSON.stringify(todos))}function renderTodos(){const todos=loadTodos(),list=document.getElementById('todoList');if(!todos.length){list.innerHTML='<div class="empty-state">No tasks yet. Add one to get started!</div>';return}list.innerHTML=todos.map((todo,index)=>`<div class="todo-item ${todo.completed?'completed':''}"><input type="checkbox" ${todo.completed?'checked':''} onchange="toggleTodo(${index})"><span class="todo-text">${escapeHtml(todo.text)}</span><button class="delete-btn" onclick="deleteTodo(${index})">Delete</button></div>`).join('')}function addTodo(){const input=document.getElementById('todoInput'),text=input.value.trim();if(!text){alert('Please enter a task');return}const todos=loadTodos();todos.push({text,completed:false});saveTodos(todos);input.value='';renderTodos()}function deleteTodo(index){const todos=loadTodos();todos.splice(index,1);saveTodos(todos);renderTodos()}function toggleTodo(index){const todos=loadTodos();todos[index].completed=!todos[index].completed;saveTodos(todos);renderTodos()}function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}document.getElementById('todoInput').addEventListener('keypress',e=>{if(e.key==='Enter')addTodo()});renderTodos()</script></body></html>
